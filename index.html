<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moveset Builder Ultra V3.6</title>
    <script type="module">
        import { Zstd } from "https://esm.sh/@hpcc-js/wasm-zstd@1.12.5?bundle";
        try {
            const zstd = await Zstd.load();
            window.zstdEngine = zstd;
            const el = document.getElementById('z-status');
            if (el) { el.innerText = 'ZSTD READY'; el.style.background = '#238636'; }
        } catch(e) {
            console.error("Zstd load failed:", e);
            const el = document.getElementById('z-status');
            if (el) { el.innerText = 'ZSTD FAILED'; el.style.background = '#da3633'; }
        }
    </script>
    <style>
        :root {
            --bg: #0d1117; --side: #161b22; --border: #30363d;
            --accent: #58a6ff; --text: #c9d1d9; --bright: #f0f6fc; --danger: #f85149;
        }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        .sidebar { width: 300px; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-content { padding: 15px; overflow-y: auto; flex: 1; min-height: 0; }
        
        .canvas { flex: 1; overflow-y: auto; padding: 20px; background: #000; border-right: 1px solid var(--border); min-width: 0; }
        .inspector { width: 280px; background: var(--side); padding: 15px; overflow-y: auto; flex-shrink: 0; }

        .header { height: 55px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: var(--side); flex-shrink: 0; }
        
        .btn { background: #21262d; border: 1px solid var(--border); color: var(--bright); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; margin-bottom: 0; }
        .btn:hover { background: #30363d; border-color: #8b949e; }
        .btn.primary { background: #238636; border-color: rgba(240,246,252,0.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
        label { font-size: 10px; text-transform: uppercase; color: #8b949e; font-weight: 800; display: block; margin-bottom: 5px; margin-top: 5px; }

        .move-card { background: #161b22; border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 15px; border-left: 4px solid transparent; transition: all 0.15s; }
        .move-card.active { border-left-color: var(--accent); background: #1c2128; border-color:#484f58; }
        
        .branch-bar { display: flex; gap: 5px; margin-top: 10px; overflow-x: auto; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 10px; scrollbar-width: thin; }
        .branch-bar::-webkit-scrollbar { height: 4px; }
        .branch-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .block-row { background: #0d1117; border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-top: 6px; font-size: 12px; transition: all 0.15s; }
        .block-row-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .block-row:hover { border-color: #484f58; }
        .block-row.expanded { border-color: var(--accent); background: #161b22; }
        
        .block-settings { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: none; }
        .block-row.expanded .block-settings { display: block; }
        
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; align-items: center;}
        .settings-grid label { margin: 0; }
        .settings-grid input, .settings-grid select { margin-bottom: 0; padding: 6px; }

        #searchRes { background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 5px; display: none; margin-bottom: 10px; max-height: 250px; overflow-y: auto; }
        .cat-label { font-size: 10px; color: var(--accent); margin: 15px 0 5px 0; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #30363d; padding-bottom: 2px; }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; height: auto; display: block; }
            .sidebar, .inspector { width: 100%; height: auto; border: none; flex-shrink: 1; }
            .sidebar { border-bottom: 1px solid var(--border); }
            .sidebar-content { overflow-y: visible; padding-bottom: 30px; }
            .canvas { width: 100%; min-height: 450px; border-right: none; border-bottom: 1px solid var(--border); overflow-y: visible; flex: none; display: block; }
            .inspector { overflow-y: visible; padding-bottom: 30px; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="header">
        <span style="font-weight:900; color:var(--accent);">ULTRA V3.6</span>
        <div id="z-status" style="font-size:9px; background:var(--danger); padding:2px 5px; border-radius:4px; color:#fff; cursor:help;" title="Zstd compression status">ZSTD: LOADING</div>
    </div>
    <div class="sidebar-content">
        <label>Roblox Toolbox Search</label>
        <div style="display:flex; gap:5px; margin-bottom:5px;">
            <select id="assetTypeSearch" style="margin:0; width:45%;">
                <option value="Audio">Audio</option>
                <option value="Decals">Decals</option>
                <option value="Meshes">Meshes</option>
                <option value="Animations">Animations</option>
            </select>
            <input id="searchIn" placeholder="Keyword..." style="margin:0; flex:1;" onkeypress="if(event.key==='Enter') searchRoblox()">
        </div>
        <button onclick="searchRoblox()" class="btn primary" style="width:100%; margin-bottom:10px;" title="Search Roblox toolbox">SEARCH TOOLBOX</button>
        <div id="searchRes"></div>

        <label>Add New Move</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <button onclick="addM('SKILL')" class="btn" title="Create new SKILL move">SKILL</button>
            <button onclick="addM('MELEE')" class="btn" title="Create new MELEE move">MELEE</button>
            <button onclick="addM('CHASE')" class="btn" title="Create new CHASE move">CHASE</button>
            <button onclick="addM('ULTIMATE')" class="btn" title="Create new ULTIMATE move">ULTIMATE</button>
            <button onclick="addM('SPECIAL')" class="btn" title="Create new SPECIAL move">SPECIAL</button>
            <button onclick="addM('AWAKENING')" class="btn" title="Create new AWAKENING move">AWK</button>
        </div>

        <div id="palette"></div>
    </div>
</div>

<div class="canvas">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center; flex-wrap:wrap; gap:10px;">
        <h3 style="margin:0;">Workspace</h3>
        <div style="display:flex; gap:8px;">
            <button class="btn" onclick="importZ()" title="Import compressed Zstd data">Import</button>
            <button class="btn primary" onclick="exportZ()" id="export-btn" title="Export workspace as Zstd">Export Zstd</button>
            <button class="btn" onclick="clearWS()" title="Clear all moves (cannot undo)">Clear</button>
        </div>
    </div>
    <div id="ws"></div>
</div>

<div class="inspector">
    <label>Move Properties</label>
    <div id="ins-content">
        <p style="text-align:center; color:#484f58; margin-top:40px;">Select a move in the workspace to edit its properties.</p>
    </div>
</div>

<script>
    window.zstdEngine = null;
    let moves = [];
    let selM = null;
    let selBranch = null; // null means "Main Line"
    let expandedBlock = null;

    const library = {
        "Combat": {
            HITBOX: { SIZE: "10, 10, 10", DAMAGE: 10, STUN: 1, BLOCKABLE: true, POSITION: "0, 0, 4", HIT_RAGDOLL: true, ATTACK_TYPE: "Melee", CAN_KILL: true, STUN_ANIM: true, CLEAR_KNOCKBACK: false },
            PROJECTILE: { DAMAGE: 10, SPEED: 100, SIZE: "12, 12, 12", POSITION: "0, 0, 0", ATTACK_TYPE: "Bullet", HIT_RAGDOLL: true, CAN_KILL: true, STUN: 1, TIME: 1, CANCEL_ENEMY: true, CLEAR_KNOCKBACK: false },
            COUNTER: { TIME: 0.5, STUN: 1, BRANCH: "hit", ATTACK_TYPE2: "Melee,Bullet,Swarm,Explosion,Domain", REMOVE_ON_HIT: true, CANCEL_ENEMY: true },
            GRAB: { TIME: 1, BODY_PART: "HumanoidRootPart", BODY_PART2: "HumanoidRootPart", POSITION: "0, 0, 4", ROTATION: "0, 180, 0", LAST_HIT: 1 },
            ULTGIB: { AMOUNT: 20 },
            HPGIB: { AMOUNT: -15 },
            HITCNCL: { BRANCH: "endlag", TIME: 1, ENDLAG: 1, FLIP: true }
        },
        "Logic": {
            WAIT: { TIME: 0.2 },
            TAG: { TAG: "marker", VALUE: "1", CHECK: false, SET: true, TIME: 1, BRANCH: "" },
            BRANCH: { BRANCH: "1", RANDOM: "" },
            STATE: { STATE: "Stun", TIME: 1, VALUE: 1, CANCEL_ON_END: false, LAST_HIT: -1 },
            LOOP: { LOOP_BACK: 1, LOOP_AMOUNT: 5, HOLD: false },
            SKILL: { MOVE: "Cancel", SPEED: 1, START: 0, ENABLE_VARIANTS: true, CANCEL_LAST: false, HOLD_FOR: 0 }
        },
        "Visual/Audio": {
            ANIM: { ANIM_USE: "[1,1]", SPEED: 1, FADE_IN: 0.1, FADE_OUT: 0.2, LOOPED: false, PREVIEW: "[0,1]", LAST_HIT: -1 },
            SFX: { ID: "0", VOLUME: 2, SPEED: 1, START: 0, CANCEL: false, END: 500, GLOBAL: false },
            VISUAL: { EFFECT: "Glow", COLOR: "255, 255, 255", ALT_COLOR: "255, 255, 255", TIME: 0.5, POSITION: "0, 0, 0", ALT_POSITION: "0, 0, 0", SIZE: 1, ALT_SIZE: 1, OPACITY: 1, ALT_OPACITY: 0, EASING_STYLE: "Linear", BODY_PART: "HumanoidRootPart" }
        },
        "Motion": {
            VELO: { FORCE: "0, 0, 50", TIME: 0.2, FADE: true, TRACK: false, RAGDOLL: 0, TRUE_RAGDOLL: false, LAST_HIT: -1 }
        }
    };

    function escapeHtml(text) {
        if(typeof text !== 'string') return text;
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    window.onload = () => {
        loadAutoSave();
        buildPalette();
        if(moves.length === 0) addM('SKILL');
        setInterval(autoSave, 30000);
    };

    function buildPalette() {
        const pal = document.getElementById('palette');
        for(let cat in library) {
            let l = document.createElement('div'); l.className = 'cat-label'; l.innerText = cat;
            pal.appendChild(l);
            let g = document.createElement('div'); g.style = 'display:grid; grid-template-columns: 1fr 1fr; gap:5px;';
            for(let b in library[cat]) {
                let btn = document.createElement('button'); btn.className = 'btn'; btn.innerText = b;
                btn.onclick = () => addBlock(b, library[cat][b]);
                g.appendChild(btn);
            }
            pal.appendChild(g);
        }
    }

    function addM(t) {
        moves.push({ NAME: "New " + t, K_NAME: t, KEY: 1, COOLDOWN: 0, DATA: { Line: [], Prop: { USE: true, AWK: true, NOCANCEL: false, NOSTUN: false, INV: false }, Req: [], Branch: {} } });
        selectM(moves.length - 1);
    }

    function selectM(i) { 
        selM = i; 
        selBranch = null; 
        expandedBlock = null; 
        render(); 
    }

    function addBranch() {
        const name = prompt("Enter new branch name (e.g., 'hit', 'endlag'):");
        if(name && name.trim() !== "") {
            const cleanName = name.trim();
            if(!moves[selM].DATA.Branch) moves[selM].DATA.Branch = {};
            if(!moves[selM].DATA.Branch[cleanName]) {
                moves[selM].DATA.Branch[cleanName] = { Req: [], Line: [] };
            }
            selBranch = cleanName;
            expandedBlock = null;
            render();
            autoSave();
        }
    }

    function toggleBlock(bi) {
        expandedBlock = (expandedBlock === bi) ? null : bi;
        render();
    }

    function addBlock(key, data) {
        if(selM === null) return;
        let activeLine = selBranch === null ? moves[selM].DATA.Line : moves[selM].DATA.Branch[selBranch].Line;
        activeLine.push({ K_NAME: key, ...JSON.parse(JSON.stringify(data)) });
        expandedBlock = activeLine.length - 1; 
        render();
        autoSave();
    }

    function deleteMove(i) {
        if(confirm("Delete this move?")) {
            moves.splice(i, 1);
            selM = null;
            selBranch = null;
            expandedBlock = null;
            render();
            autoSave();
        }
    }

    function deleteBlock(bi, e) {
        e.stopPropagation();
        let activeLine = selBranch === null ? moves[selM].DATA.Line : moves[selM].DATA.Branch[selBranch].Line;
        activeLine.splice(bi, 1);
        if (expandedBlock === bi) expandedBlock = null;
        render();
        autoSave();
    }

    function clearWS() {
        if(confirm("Clear entire workspace? Cannot undo.")) {
            moves = [];
            selM = null;
            selBranch = null;
            expandedBlock = null;
            render();
            autoSave();
        }
    }

    function render() {
        const ws = document.getElementById('ws');
        if(moves.length === 0) {
            ws.innerHTML = '<p style="text-align:center; color:#484f58; margin-top:20px;">No moves yet. Add one from the sidebar.</p>';
            renderInspector();
            return;
        }
        
        ws.innerHTML = moves.map((m, i) => {
            const isActiveMove = selM === i;
            let activeLine = [];
            if (isActiveMove) {
                activeLine = selBranch === null ? m.DATA.Line : (m.DATA.Branch && m.DATA.Branch[selBranch] ? m.DATA.Branch[selBranch].Line : []);
            } else {
                activeLine = m.DATA.Line; // Just for counting preview on inactive
            }

            return `
            <div class="move-card ${isActiveMove?'active':''}" onclick="selectM(${i})">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong style="color:var(--accent); font-size:15px;">${escapeHtml(m.NAME || 'Unnamed')}</strong>
                    <span style="font-size:10px; opacity:0.6;">${m.K_NAME} | KEY: ${m.KEY || '-'}</span>
                </div>
                <div style="display:flex; gap:5px; margin-top:8px;">
                    <span style="font-size:9px; color:#8b949e; flex:1;">${activeLine.length} block(s) in active line</span>
                    <span style="color:var(--danger); cursor:pointer; font-size:11px;" onclick="event.stopPropagation(); deleteMove(${i});" title="Delete move">✕ Delete</span>
                </div>
                
                ${isActiveMove ? `
                    <div class="branch-bar">
                        <button class="btn ${selBranch===null?'primary':''}" onclick="event.stopPropagation(); selBranch=null; expandedBlock=null; render();">Main Line</button>
                        ${Object.keys(m.DATA.Branch || {}).map(bName => `
                            <button class="btn ${selBranch===bName?'primary':''}" onclick="event.stopPropagation(); selBranch='${bName}'; expandedBlock=null; render();">↳ ${escapeHtml(bName)}</button>
                        `).join('')}
                        <button class="btn" onclick="event.stopPropagation(); addBranch();" style="color: var(--accent);">+ Branch</button>
                    </div>
                ` : ''}

                <div style="${isActiveMove ? '' : 'display:none;'}">
                    ${activeLine.map((b, bi) => {
                        const isExpanded = expandedBlock === bi;
                        return `
                        <div class="block-row ${isExpanded ? 'expanded' : ''}">
                            <div class="block-row-header" onclick="event.stopPropagation(); toggleBlock(${bi});">
                                <span><strong style="color:#8b949e;">${bi+1}.</strong> ${escapeHtml(b.K_NAME)}</span>
                                <div>
                                    <span style="font-size:10px; color:#8b949e; margin-right:8px;">${isExpanded ? '▼' : '▶'}</span>
                                    <span style="color:var(--danger); cursor:pointer; font-weight:bold;" onclick="deleteBlock(${bi}, event)" title="Delete block">✕</span>
                                </div>
                            </div>
                            <div class="block-settings" onclick="event.stopPropagation();">
                                <div class="settings-grid">
                                    ${Object.keys(b).filter(k => k !== 'K_NAME').map(k => {
                                        const val = b[k];
                                        const safeVal = (typeof val === 'object' && val !== null) ? JSON.stringify(val) : String(val);
                                        const safeValEsc = escapeHtml(safeVal);
                                        
                                        if(typeof val === 'boolean') {
                                            return `
                                                <label>${k.replace(/_/g, ' ')}</label>
                                                <select onchange="upd(${bi}, '${k}', this.value === 'true')">
                                                    <option value="true" ${val?'selected':''}>True</option>
                                                    <option value="false" ${!val?'selected':''}>False</option>
                                                </select>
                                            `;
                                        } else {
                                            return `
                                                <label>${k.replace(/_/g, ' ')}</label>
                                                <input type="text" value="${safeValEsc}" onchange="upd(${bi}, '${k}', this.value)">
                                            `;
                                        }
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    `}).join('')}
                    ${activeLine.length === 0 ? '<p style="font-size:11px; color:#484f58; text-align:center;">This line is empty.</p>' : ''}
                </div>
            </div>
        `}).join('');
        
        renderInspector();
    }

    function renderInspector() {
        const ins = document.getElementById('ins-content');
        if (selM === null) {
            ins.innerHTML = '<p style="text-align:center; color:#484f58; margin-top:40px;">Select a move in the workspace to edit its properties.</p>';
            return;
        }
        const m = moves[selM];
        if(!m.DATA.Prop) m.DATA.Prop = {};

        ins.innerHTML = `
            <label>Move Name</label>
            <input value="${escapeHtml(m.NAME || '')}" onchange="moves[selM].NAME=this.value; render(); autoSave();">
            
            <label>Move Type (K_NAME)</label>
            <select onchange="moves[selM].K_NAME=this.value; render(); autoSave();">
                <option ${m.K_NAME=='SKILL'?'selected':''}>SKILL</option>
                <option ${m.K_NAME=='MELEE'?'selected':''}>MELEE</option>
                <option ${m.K_NAME=='CHASE'?'selected':''}>CHASE</option>
                <option ${m.K_NAME=='ULTIMATE'?'selected':''}>ULTIMATE</option>
                <option ${m.K_NAME=='SPECIAL'?'selected':''}>SPECIAL</option>
                <option ${m.K_NAME=='AWAKENING'?'selected':''}>AWAKENING</option>
            </select>
            
            <label>Cooldown</label>
            <input type="number" value="${m.COOLDOWN || 0}" onchange="moves[selM].COOLDOWN=Number(this.value); render(); autoSave();">
            
            <label>Input Key (ID)</label>
            <input type="number" value="${m.KEY || 1}" onchange="moves[selM].KEY=Number(this.value); render(); autoSave();">
            
            <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
            
            <h4 style="margin:0 0 10px 0; color:var(--accent); font-size:12px;">Boolean Props</h4>
            ${['USE', 'AWK', 'AWK2', 'NOCANCEL', 'NOSTUN', 'INV'].map(prop => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; font-size:12px;">
                    <label style="margin:0;">${prop}</label>
                    <select style="width:70px; padding:4px; margin:0;" onchange="updateProp('${prop}', this.value === 'true')">
                        <option value="true" ${m.DATA.Prop[prop]?'selected':''}>True</option>
                        <option value="false" ${!m.DATA.Prop[prop]?'selected':''}>False</option>
                    </select>
                </div>
            `).join('')}
        `;
    }

    function updateProp(prop, val) {
        moves[selM].DATA.Prop[prop] = val;
        autoSave();
    }

    function upd(bi, k, v) {
        let val = v;
        if (typeof v !== 'boolean') {
            try {
                if ((v.startsWith('[') && v.endsWith(']')) || (v.startsWith('{') && v.endsWith('}'))) {
                    val = JSON.parse(v);
                } else if (!isNaN(v) && v.trim() !== "") {
                    val = Number(v);
                }
            } catch(e) {}
        }
        let activeLine = selBranch === null ? moves[selM].DATA.Line : moves[selM].DATA.Branch[selBranch].Line;
        activeLine[bi][k] = val;
        autoSave();
    }

    async function searchRoblox() {
        const q = document.getElementById('searchIn').value.trim();
        const type = document.getElementById('assetTypeSearch').value;
        if(!q) return;
        
        const box = document.getElementById('searchRes');
        box.style.display = 'block'; 
        box.innerHTML = "<div style='color:var(--accent); font-size:12px; padding:10px;'>Searching Toolbox...</div>";
        
        try {
            // Using official Roblox API via RoProxy: Creator Store API (v1)
            const url = `https://apis.roproxy.com/toolbox-service/v1/creations?query=${encodeURIComponent(q)}&type=${encodeURIComponent(type)}&limit=10`;
            const res = await fetch(url);
            const json = await res.json();
            
            if (json.data && json.data.length > 0) {
                renderResults(json.data.map(i => ({ id: i.asset.id, name: i.asset.name })), type, box);
            } else {
                box.innerHTML = "<div style='padding:10px; font-size:11px;'>No items found in this category.</div>";
            }
        } catch(e) { 
            // Fallback to Catalog Search API if toolbox endpoint fails
            try {
                const res = await fetch(`https://catalog.roproxy.com/v1/search/items/details?keyword=${encodeURIComponent(q)}&limit=10`);
                const json = await res.json();
                if(json.data && json.data.length > 0) {
                    renderResults(json.data.map(i => ({ id: i.id, name: i.name })), type, box);
                } else {
                    box.innerHTML = "<div style='padding:10px; font-size:11px;'>No items found.</div>";
                }
            } catch(err) {
                box.innerHTML = "<div style='padding:10px; font-size:11px; color:var(--danger);'>Network blocked. Try manual ID entry.</div>"; 
            }
        }
    }

    function renderResults(items, type, box) {
        box.innerHTML = items.map(a => {
            let thumb = `https://thumbnails.roproxy.com/v1/assets?assetIds=${a.id}&returnPolicy=PlaceHolder&size=150x150&format=Png`;
            return `
                <div style="display:flex; gap:10px; margin-bottom:10px; padding:8px; border:1px solid var(--border); border-radius:6px; background:#1c2128;">
                    <img src="${thumb}" style="width:40px; height:40px; border-radius:4px; object-fit:cover; background:#000;" onerror="this.src=''">
                    <div style="flex:1; min-width:0;">
                        <div style="font-size:11px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</div>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <button class="btn primary" style="padding:3px 6px; font-size:9px; flex:1;" onclick="copyID('${a.id}')">ID</button>
                            ${(type === 'Decals' || type === 'Meshes') ? `<button class="btn" style="padding:3px 6px; font-size:9px; flex:1;" onclick="copyID('${a.id - 1}')" title="Try ID-1 for Texture variant">-1</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.copyID = function(id) {
        navigator.clipboard.writeText(id).then(() => {
            alert(`Copied ID: ${id}`);
        });
    }

    function autoSave() {
        try { localStorage.setItem('moveset_autosave_v36', JSON.stringify(moves)); } catch(e) {}
    }

    function loadAutoSave() {
        try {
            const saved = localStorage.getItem('moveset_autosave_v36');
            if(saved) moves = JSON.parse(saved);
        } catch(e) {}
    }

    function exportZ() {
        if(!window.zstdEngine) {
            alert("Zstd not ready. Please wait for the ZSTD READY status.");
            return;
        }
        const raw = JSON.stringify(moves.map(m => ({ ...m, DATA: JSON.stringify(m.DATA) })));
        try {
            const uint8 = new TextEncoder().encode(raw);
            const compressed = window.zstdEngine.compress(uint8);
            let bin = '';
            for (let i = 0; i < compressed.length; i++) bin += String.fromCharCode(compressed[i]);
            const b64 = btoa(bin);
            navigator.clipboard.writeText(b64).then(() => {
                alert("✓ Zstd string copied to clipboard!");
            }).catch(() => {
                const t = document.createElement('textarea');
                t.value = b64; document.body.appendChild(t); t.select();
                document.execCommand('copy'); document.body.removeChild(t);
                alert("✓ Zstd string copied to clipboard!");
            });
        } catch(e) { alert("Export Error: " + e.message); }
    }

    function importZ() {
        const s = prompt("Paste your Zstd data:");
        if(!s || !window.zstdEngine) return;
        try {
            const bin = atob(s);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            const decoded = new TextDecoder().decode(window.zstdEngine.decompress(bytes));
            moves = JSON.parse(decoded).map(m => {
                let parsedData = m.DATA;
                if (typeof m.DATA === 'string') parsedData = JSON.parse(m.DATA);
                return { ...m, DATA: parsedData };
            });
            selM = null;
            selBranch = null;
            expandedBlock = null;
            render();
            autoSave();
            alert("✓ Moveset imported successfully!");
        } catch(e) { alert("Import failed. Check that the Zstd string is valid.\n" + e.message); }
    }
</script>
