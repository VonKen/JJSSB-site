<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moveset Builder Ultra V3.8</title>
    <script type="module">
        import { Zstd } from "https://esm.sh/@hpcc-js/wasm-zstd@1.12.5?bundle";
        try {
            const zstd = await Zstd.load();
            window.zstdEngine = zstd;
            const el = document.getElementById('z-status');
            if (el) { el.innerText = 'ZSTD READY'; el.style.background = '#238636'; }
        } catch(e) {
            const el = document.getElementById('z-status');
            if (el) { el.innerText = 'ZSTD FAILED'; el.style.background = '#da3633'; }
        }
    </script>
    <style>
        :root {
            --bg: #0d1117; --side: #161b22; --border: #30363d;
            --accent: #58a6ff; --text: #c9d1d9; --bright: #f0f6fc; --danger: #f85149;
        }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        .sidebar { width: 320px; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-content { padding: 15px; overflow-y: auto; flex: 1; }
        .canvas { flex: 1; overflow-y: auto; padding: 20px; background: #000; border-right: 1px solid var(--border); }
        .inspector { width: 280px; background: var(--side); padding: 15px; overflow-y: auto; flex-shrink: 0; }

        .header { height: 55px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: var(--side); flex-shrink: 0; }
        .btn { background: #21262d; border: 1px solid var(--border); color: var(--bright); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; text-align: center; }
        .btn:hover { background: #30363d; border-color: #8b949e; }
        .btn.primary { background: #238636; border-color: rgba(240,246,252,0.1); }
        
        input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; }
        label { font-size: 10px; text-transform: uppercase; color: #8b949e; font-weight: 800; display: block; margin-bottom: 4px; }

        .move-card { background: #161b22; border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 15px; border-left: 4px solid transparent; }
        .move-card.active { border-left-color: var(--accent); background: #1c2128; }
        
        #searchRes { background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 5px; display: none; margin-bottom: 10px; max-height: 400px; overflow-y: auto; }
        .res-card { display: flex; gap: 10px; margin-bottom: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: #1c2128; }
        
        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; display: block; }
            .sidebar, .inspector, .canvas { width: 100%; height: auto; border: none; flex-shrink: 1; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="header">
        <span style="font-weight:900; color:var(--accent);">ULTRA V3.8</span>
        <div id="z-status" style="font-size:9px; background:var(--danger); padding:2px 5px; border-radius:4px; color:#fff;">ZSTD: LOADING</div>
    </div>
    <div class="sidebar-content">
        <label>Search Source</label>
        <select id="searchSource" onchange="updateAssetTypes()">
            <option value="creator">Creator Store (Audio, Mesh, Model)</option>
            <option value="catalog">Marketplace (Hats, Animation, Gear)</option>
        </select>

        <label>Asset Type</label>
        <select id="assetTypeSearch">
            </select>

        <div style="display:flex; gap:5px;">
            <input id="searchIn" placeholder="Search keywords..." onkeypress="if(event.key==='Enter') executeSearch()">
            <button onclick="executeSearch()" class="btn primary">SEARCH</button>
        </div>
        
        <div id="searchRes"></div>

        <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
        <label>Add New Move</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;" id="moveButtons">
            <button onclick="addM('SKILL')" class="btn">SKILL</button>
            <button onclick="addM('MELEE')" class="btn">MELEE</button>
            <button onclick="addM('CHASE')" class="btn">CHASE</button>
            <button onclick="addM('ULTIMATE')" class="btn">ULT</button>
        </div>
    </div>
</div>

<div class="canvas">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
        <h3 style="margin:0;">Workspace</h3>
        <div style="display:flex; gap:8px;">
            <button class="btn" onclick="importZ()">Import</button>
            <button class="btn primary" onclick="exportZ()">Export Zstd</button>
        </div>
    </div>
    <div id="ws"></div>
</div>

<div class="inspector">
    <label>Properties</label>
    <div id="ins-content"><p style="text-align:center; color:#484f58; margin-top:40px;">Select a move</p></div>
</div>

<script>
    let moves = [];
    let selM = null;

    const creatorTypes = [
        { name: "Models", id: "model" },
        { name: "Audio", id: "audio" },
        { name: "Meshes", id: "mesh" },
        { name: "Decals", id: "decal" }
    ];

    const catalogTypes = [
        { name: "All", id: "1" },
        { name: "Accessories", id: "11" },
        { name: "Animations", id: "12" },
        { name: "Gear", id: "5" }
    ];

    function updateAssetTypes() {
        const source = document.getElementById('searchSource').value;
        const select = document.getElementById('assetTypeSearch');
        const types = source === 'creator' ? creatorTypes : catalogTypes;
        select.innerHTML = types.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    }

    async function executeSearch() {
        const source = document.getElementById('searchSource').value;
        const type = document.getElementById('assetTypeSearch').value;
        const query = document.getElementById('searchIn').value;
        const box = document.getElementById('searchRes');
        
        box.style.display = 'block';
        box.innerHTML = "<div style='font-size:11px; padding:10px;'>Searching...</div>";

        let url = "";
        if (source === 'creator') {
            // Using Toolbox Service API for Audio/Meshes
            url = `https://apis.roproxy.com/toolbox-service/v2/assets:search?keyword=${encodeURIComponent(query)}&assetType=${type}&limit=10`;
        } else {
            // Using Catalog API for Avatar items
            url = `https://catalog.roproxy.com/v1/search/items/details?Category=${type}&Keyword=${encodeURIComponent(query)}&Limit=10`;
        }

        try {
            const res = await fetch(url);
            const json = await res.json();
            const items = json.data || json.results || [];
            
            if (items.length > 0) {
                box.innerHTML = items.map(i => {
                    const id = i.id || i.assetId;
                    const name = i.name || i.assetName;
                    const thumb = `https://thumbnails.roproxy.com/v1/assets?assetIds=${id}&size=150x150&format=Png`;
                    return `
                        <div class="res-card">
                            <img src="${thumb}" style="width:40px; height:40px; background:#000; border-radius:4px;">
                            <div style="flex:1; min-width:0;">
                                <div style="font-size:11px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${name}</div>
                                <div style="font-size:9px; color:#8b949e; margin-bottom:4px;">ID: ${id}</div>
                                <button class="btn" style="padding:2px 6px; font-size:9px;" onclick="navigator.clipboard.writeText('${id}')">Copy ID</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                box.innerHTML = "<div style='padding:10px;'>No results.</div>";
            }
        } catch(e) {
            box.innerHTML = "<div style='color:var(--danger); padding:10px;'>Error: Check connection/proxy.</div>";
        }
    }

    // Standard core logic preserved from index-1.html
    function addM(t) {
        moves.push({ NAME: "New Move", K_NAME: t, DATA: { Line: [], Prop: { USE: true } } });
        render();
    }

    function render() {
        const ws = document.getElementById('ws');
        ws.innerHTML = moves.map((m, i) => `
            <div class="move-card ${selM===i?'active':''}" onclick="selM=${i}; render();">
                <strong>${m.NAME}</strong> (${m.K_NAME})
            </div>
        `).join('');
    }

    window.onload = () => {
        updateAssetTypes();
        render();
    };
</script>
</body>
</html>
